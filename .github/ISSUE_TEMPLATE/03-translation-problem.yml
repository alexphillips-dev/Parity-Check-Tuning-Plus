name: Translation problem
description: Report incorrect, unclear, or untranslated plugin wording.
labels: [translation, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        See [language support](https://github.com/alexphillips-dev/Parity-Check-Tuning-Plus/wiki/Languages-and-Accessibility) for supported locales.
        This report is public. Remove private information from text and screenshots. You may describe the problem in your preferred language.
  - type: input
    id: plugin-version
    attributes:
      label: Parity Check Tuning Plus version
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Selected Unraid language
      description: Include the locale code if known.
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Affected page or message
      placeholder: Settings > Scheduler, Assistant, history, notification, or CLI output.
    validations:
      required: true
  - type: textarea
    id: current-wording
    attributes:
      label: Current wording
      description: Copy the phrase or describe the missing text.
    validations:
      required: true
  - type: textarea
    id: suggested-wording
    attributes:
      label: Suggested wording or explanation
      description: A proposed translation is helpful but not required. You can explain why the current text is incorrect instead.
    validations:
      required: true
  - type: input
    id: unraid-version
    attributes:
      label: Unraid version
    validations:
      required: false
  - type: textarea
    id: screenshot
    attributes:
      label: Sanitized screenshot or context
      description: Optional. Crop unrelated content before attaching an image.
    validations:
      required: false
